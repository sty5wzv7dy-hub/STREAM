<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090710">
<title>Stream</title>
<style>
* { box-sizing: border-box; }

:root {
  --bg: #090710;
  --tile: #1b1028;
  --purple: #a855f7;
  --text: #f5edff;
}

body {
  margin: 0;
  padding: 36px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

header { margin-bottom: 32px; }

.logo {
  color: #d8b4fe;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 5px;
}

h1 {
  margin: 8px 0;
  font-size: clamp(36px, 5vw, 64px);
}

header p {
  color: #c084fc;
  letter-spacing: 4px;
}

h2 { font-size: 25px; }

.links {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
}

a {
  min-height: 150px;
  padding: 22px 14px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  gap: 12px;
  color: white;
  text-decoration: none;
  background: var(--tile);
  border: 2px solid #492467;
  border-radius: 18px;
  transition: transform .12s, border-color .12s;
}

.symbol { font-size: 36px; }
.name { font-size: 21px; font-weight: bold; }
.desc { color: #c4b5fd; font-size: 14px; }

a:focus, a:focus-visible {
  outline: 4px solid #e9d5ff;
  outline-offset: 3px;
  border-color: #c084fc;
  background: #382052;
  box-shadow: 0 0 25px #a855f7;
  transform: scale(1.06);
}

footer {
  text-align: center;
  color: #a78bfa;
  margin-top: 36px;
  font-size: 12px;
}

@media (max-width: 900px) {
  .links { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 500px) {
  body { padding: 22px 16px; }
  .links { grid-template-columns: 1fr; }
  a { min-height: 90px; flex-direction: row; align-items: center; }
  .name { font-size: 18px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">▶ STREAM</div>
  <h1>Stream</h1>
  <p>DEIN ENTERTAINMENT HUB</p>
</header>

<h2>Was möchtest du schauen?</h2>

<div class="links">
  <a href="https://aniworld.to/">
    <span class="symbol">🎬</span>
    <span class="name">AniWorld</span>
    <span class="desc">🇩🇪 Anime</span>
  </a>

  <a href="http://186.2.175.5">
    <span class="symbol">📺</span>
    <span class="name">S.to</span>
    <span class="desc">🇩🇪 Serien</span>
  </a>

  <a href="https://www.filmo.de/">
    <span class="symbol">🎞️</span>
    <span class="name">Filmo</span>
    <span class="desc">🇩🇪 Filme</span>
  </a>

  <a href="https://streamkiste.tv/">
    <span class="symbol">🍿</span>
    <span class="name">Streamkiste</span>
    <span class="desc">🇩🇪 Streaming</span>
  </a>

  <a href="https://kinoger.com/">
    <span class="symbol">🎥</span>
    <span class="name">Kinoger</span>
    <span class="desc">🇩🇪 Filme</span>
  </a>

  <a href="https://webflix.info/">
    <span class="symbol">🎭</span>
    <span class="name">Webflix</span>
    <span class="desc">🇫🇷 Streaming</span>
  </a>

  <a href="https://xalaflix.tax/">
    <span class="symbol">📽️</span>
    <span class="name">Xalaflix</span>
    <span class="desc">🇫🇷 Filme und Serien</span>
  </a>

  <a href="https://franime.fr/">
    <span class="symbol">✨</span>
    <span class="name">Franime</span>
    <span class="desc">🇫🇷 Anime</span>
  </a>
</div>

<footer>STREAM · NEON EDITION</footer>

<script>
document.querySelectorAll('.links a').forEach(link => {
  link.addEventListener('click', () => {
    link.blur();
  });
});
</script>
</body>
</html>
