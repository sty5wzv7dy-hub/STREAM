<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090710">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="AnimeStream">
<title>AnimeStream</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 28px 18px;
  background: #090710;
  color: #f5edff;
  font-family: -apple-system, sans-serif;
}
header { text-align: center; margin: 22px 0 32px; }
.logo { font-size: 42px; color: #d8b4fe; }
h1 { margin: 8px 0; font-size: 30px; }
header p { color: #c084fc; letter-spacing: 2px; font-size: 11px; }
h2 { font-size: 20px; }
.subtitle { color: #b9aec9; font-size: 14px; margin-bottom: 22px; }
.links { display: grid; gap: 13px; }
a {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px;
  color: white;
  text-decoration: none;
  background: #1b1028;
  border: 1px solid #9333ea;
  border-radius: 17px;
}
.symbol { font-size: 25px; }
.name { font-weight: bold; }
.desc { color: #c4b5fd; font-size: 12px; margin-top: 5px; }
.arrow { margin-left: auto; color: #c084fc; font-size: 24px; }
footer { text-align: center; color: #a78bfa; font-size: 10px; margin-top: 28px; }
</style>
</head>
<body>
<header>
  <div class="logo">▶</div>
  <h1>AnimeStream</h1>
  <p>DEIN STREAMING HUB</p>
</header>
<h2>Was möchtest du schauen?</h2>
<p class="subtitle">Wähle deine Streaming-Seite aus.</p>
<div class="links">
  <a href="https://aniworld.to/"><span class="symbol">🎬</span><span><span class="name">AniWorld</span><div class="desc">Anime entdecken</div></span><span class="arrow">›</span></a>
  <a href="http://186.2.175.5"><span class="symbol">📺</span><span><span class="name">S.to</span><div class="desc">Deine Serien</div></span><span class="arrow">›</span></a>
  <a href="https://www.youtube.com/"><span class="symbol">▶️</span><span><span class="name">YouTube</span><div class="desc">Videos und mehr</div></span><span class="arrow">›</span></a>
  <a href="https://franime.fr/"><span class="symbol">🎭</span><span><span class="name">Franime</span><div class="desc">Anime auf Französisch</div></span><span class="arrow">›</span></a>
  <a href="https://xalaflix.tax/"><span class="symbol">🎞️</span><span><span class="name">Xalaflix</span><div class="desc">Filme und Serien</div></span><span class="arrow">›</span></a>
</div>
<footer>ANIMESTREAM · NEON EDITION</footer>
</body>
</html>
